<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Ilustrações · conferência</title>
<style>
  body { margin: 0; padding: 16px; background: #FFF4E4; font: 13px/1.3 system-ui, sans-serif; color: #2A1610; }
  .g { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  figure { margin: 0; text-align: center; }
  img { width: 100%; aspect-ratio: 1; border-radius: 50%; background: #F3E3C7; display: block; }
  h2 { margin: 24px 0 8px; font-size: 16px; }
</style>
</head>
<body>
<p>Página de conferência das ilustrações geradas por <code>gerar_dados.py</code> (não faz parte do site).</p>
<div id="out"></div>
<script src="../js/dados.js"></script>
<script>
  const out = document.getElementById('out');
  for (const c of window.CATEGORIAS) {
    const it = c.itens.filter(i => i.ilus);
    if (!it.length) continue;
    out.insertAdjacentHTML('beforeend', `<h2>${c.nome} (${it.length})</h2><div class="g">${it.map(i => `<figure><img src="../${i.img}" alt=""><figcaption>${i.nome}</figcaption></figure>`).join('')}</div>`);
  }
</script>
</body>
</html>
